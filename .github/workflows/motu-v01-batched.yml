name: MOTU v0.1 batched validation
on:
  push:
    branches: [research/motu-v01-underwriter-20260926]
    paths:
      - research/motu_v01_batched.py
      - .github/workflows/motu-v01-batched.yml
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check numpy pandas requests
      - name: Run batched MOTU validation
        env:
          MOTU_OUT_DIR: motu_v01_batched_results
        run: python research/motu_v01_batched.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motu-v01-batched-results
          path: motu_v01_batched_results/
          if-no-files-found: warn
