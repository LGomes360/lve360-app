name: MOTU v0.5 sealed holdout
on:
  push:
    branches: [research/motu-v01-underwriter-20260926]
    paths:
      - research/motu_v05_holdout.py
      - .github/workflows/motu-v05-holdout.yml
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check numpy pandas
      - name: Install Dolt
        run: |
          sudo bash -c 'curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | bash'
          dolt version
      - name: Clone data
        run: |
          dolt clone --depth 1 --single-branch post-no-preference/options /tmp/options
          dolt clone --depth 1 --single-branch post-no-preference/stocks /tmp/stocks
          if dolt clone --depth 1 --single-branch post-no-preference/earnings /tmp/earnings; then
            echo "earnings clone available"
          else
            echo "earnings clone unavailable"
            exit 1
          fi
      - name: Run sealed holdout
        env:
          MOTU_OUT_DIR: motu_v05_results
        run: python research/motu_v05_holdout.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motu-v05-results
          path: motu_v05_results/
          if-no-files-found: warn
