name: MOTU Forward offline validation
on:
  push:
    branches: [research/motu-v01-underwriter-20260926]
    paths: ['research/**', '.github/workflows/motu-forward-tests.yml']
  pull_request:
    branches: [research/motu-v01-underwriter-20260926]
    paths: ['research/**', '.github/workflows/motu-forward-tests.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/motu_forward/requirements-test.txt
      - run: python -m unittest discover -s research/tests -v
