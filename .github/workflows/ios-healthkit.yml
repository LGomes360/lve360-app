name: iPhone Health bridge

on:
  pull_request:
    paths:
      - "ios/LVE360HealthBridge/**"
      - ".github/workflows/ios-healthkit.yml"
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate iOS project
        working-directory: ios/LVE360HealthBridge
        run: xcodegen generate
      - name: Compile and run unit tests in iPhone simulator
        working-directory: ios/LVE360HealthBridge
        run: |
          xcodebuild test \
            -project LVE360HealthBridge.xcodeproj \
            -scheme LVE360HealthBridge \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            CODE_SIGNING_ALLOWED=NO
