name: Probe DoltHub research data
on:
  push:
    branches: [research/qie-v06-relative-value-20260926]
    paths:
      - research/dolthub_probe.py
      - .github/workflows/dolthub-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python research/dolthub_probe.py
