name: MOTU v0.3 Trouble Gate
on:
  push:
    branches: [research/motu-v01-underwriter-20260926]
    paths:
      - research/motu_v03_trouble_gate.py
      - .github/workflows/motu-v03-trouble-gate.yml
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check numpy pandas
      - name: Install Dolt
        run: |
          sudo bash -c 'curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | bash'
          dolt version
      - name: Clone local market databases
        run: |
          dolt clone --depth 1 --single-branch post-no-preference/options /tmp/options
          dolt clone --depth 1 --single-branch post-no-preference/stocks /tmp/stocks
          dolt clone --depth 1 --single-branch post-no-preference/earnings /tmp/earnings
          du -sh /tmp/options /tmp/stocks /tmp/earnings
      - name: Run MOTU v0.3 Trouble Gate
        env:
          MOTU_OUT_DIR: motu_v03_results
        run: python research/motu_v03_trouble_gate.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motu-v03-results
          path: motu_v03_results/
          if-no-files-found: warn
