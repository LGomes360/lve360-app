name: Reminder dispatcher

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminder-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Trigger reminder dispatcher
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/run-reminder-dispatch.mjs
